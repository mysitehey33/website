<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EgoTrampoline</title>
    <link rel="icon" type="image/png" href="EgoTrampolineMTransparentWhite.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #202226;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        .header {
            width: 100%;
            background-color: #17181c;
            border-top: 2px solid #e51d2e;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0 40px;
            height: 100px;
            overflow: hidden;
        }
        .main-logo {
            width: 300px;
            height: auto;
        }
        .content-area {
            flex: 1;
            padding: 50px 40px;
            box-sizing: border-box;
        }
        .games-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: flex-start;
        }
        .game-card {
            width: 230px;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s ease;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
        .game-image {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .game-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }
        .footer {
            width: 100%;
            padding: 30px;
            background-color: #17181c;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .footer-logo {
            width: 40px;
            height: auto;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }
        .footer-logo:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="header">
        <img class="main-logo" src="EgoTrampolineTransWhite.png" alt="EgoTrampoline">
    </header>

    <main class="content-area">
        <div class="games-grid">
            <a class="game-card" href="https://store.steampowered.com/app/4935510/Cellar_Keeper/" target="_blank" rel="noopener noreferrer">
                <img class="game-image" src="cellar_keeper_library_capsule.png" alt="Cellar Keeper">
                <span class="game-title">Cellar Keeper</span>
            </a>
        </div>
    </main>

    <footer class="footer">
        <img class="footer-logo" src="EgoTrampolineMTransparentWhite.png" alt="EgoTrampoline Mark">
    </footer>
</body>
</html>
