<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EgoTrampoline</title>

    <link rel="icon" type="image/png" href="EgoTrampolineMTransparentWhite.png">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Şık ve sade bir font */
        }

        body {
            display: flex;
            flex-direction: column; /* İçerikleri alt alta dizer */
            justify-content: center;
            align-items: center;
            gap: 50px; /* Logo ile oyun arasındaki boşluk */
        }

        /* Ana Logo Stili */
        .main-logo {
            max-width: 300px; /* Logonun ekranda çok devasa durmasını engeller */
            height: auto;
        }

        /* Tıklanabilir Oyun Alanı */
        .steam-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none; /* Linkin altındaki çizgiyi kaldırır */
            color: #1a1a1a;
            transition: transform 0.2s ease-in-out; /* Yumuşak bir büyüme animasyonu */
        }

        /* Mouse ile üzerine gelince çalışacak efekt */
        .steam-link:hover {
            transform: scale(1.05); /* Yüzde 5 büyütür */
        }

        /* Oyun Görseli (Steam Capsule vs.) */
        .game-image {
            max-width: 460px; /* Steam'in header kapsül boyutlarına yakın */
            width: 100%;
            height: auto;
            border-radius: 8px; /* Köşeleri hafif yuvarlatır */
            box-shadow: 0 8px 16px rgba(0,0,0,0.15); /* Hafif, şık bir gölge */
            margin-bottom: 15px; /* Görsel ile yazı arası boşluk */
        }

        /* Oyun İsmi */
        .game-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <!-- 1. Stüdyo Logosu -->
    <img class="main-logo" src="EgoTrampolineTransBlack.png" alt="EgoTrampoline">

    <!-- 2. Steam Oyun Linki -->
    <!-- href kısmına kendi Steam mağaza linkini koymalısın -->
    <a class="steam-link" href="https://store.steampowered.com/app/4935510/Cellar_Keeper/" target="_blank" rel="noopener noreferrer">
        
        <!-- Oyunun Steam'deki kapsül veya header görselini buraya ekle -->
        <img class="game-image" src="cellar_keeper_library_capsule.png" alt="Cellar Keeper">
        
        <span class="game-title">Cellar Keeper</span>
    </a>
</body>
</html>
