<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EgoTrampoline</title>

    <link rel="icon" type="image/png" href="EgoTrampolineMTransparentWhite.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #262930;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
            background-color: #1a1c21;
            padding: 20px 40px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .main-logo {
            max-width: 300px;
            height: auto;
        }

        .content-area {
            flex: 1;
            padding: 60px 40px;
            box-sizing: border-box;
        }

        .games-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: flex-start;
        }

        .game-card {
            width: 250px;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #ffffff;
        }

        .game-image-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background-color: #1a1c21;
        }

        .game-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-image {
            transform: scale(1.05);
        }

        .game-info {
            padding-top: 15px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .footer {
            width: 100%;
            padding: 30px;
            background-color: #1a1c21;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .footer-logo {
            max-width: 50px;
            height: auto;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .footer-logo:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <header class="header">
        <img class="main-logo" src="EgoTrampolineTransWhite.png" alt="EgoTrampoline">
    </header>

    <main class="content-area">
        <div class="games-grid">
            
            <a class="game-card" href="https://store.steampowered.com/app/4935510/Cellar_Keeper/" target="_blank" rel="noopener noreferrer">
                <div class="game-image-container">
                    <img class="game-image" src="cellar_keeper_library_capsule.png" alt="Cellar Keeper">
                </div>
                <div class="game-info">
                    <h2 class="game-title">Cellar Keeper</h2>
                </div>
            </a>
            
        </div>
    </main>

    <footer class="footer">
        <img class="footer-logo" src="EgoTrampolineMTransparentWhite.png" alt="EgoTrampoline Mark">
    </footer>

</body>
</html>
