<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EgoTrampoline</title>

    <link rel="icon" type="image/png" href="EgoTrampolineMTransparentWhite.png">

    <style>
        /* Genel sayfa ayarları ve Siyah Arka Plan */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; /* height yerine min-height: Sayfa içeriği uzarsa arka plan kopmaz */
            background-color: #0f0f13; /* Tam siyah yerine göze daha hoş gelen çok koyu gri/lacivert */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff; /* Yazıları varsayılan olarak beyaz yapar */
        }

        /* Flex container ayarları */
        body {
            display: flex;
            flex-direction: column;
            align-items: center; /* Yatayda ortalar */
            /* justify-content: center; kaldırdık çünkü logoyu en üste yaslamak istiyoruz */
            padding-bottom: 50px; /* En alta safe area (boşluk) ekler */
        }

        /* Ana Logo Stili - En Üstte */
        .main-logo {
            margin-top: 40px; /* Üstten bırakılan pay */
            margin-bottom: 60px; /* Logo ile aşağıdaki oyun kartı arasındaki mesafe */
            max-width: 300px;
            height: auto;
        }

        /* Hafif Transparan Holder (Kart) Tasarımı */
        .game-card {
            background: rgba(255, 255, 255, 0.05); /* İçeriyi çok hafif aydınlatan transparan arka plan */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Çok ince, zarif bir kenarlık */
            border-radius: 12px; /* Kartın köşelerini yuvarlatır */
            padding: 25px; /* Kartın içindeki boşluklar */
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Karta derinlik veren dış gölge */
        }

        /* Tıklanabilir Oyun Alanı (Kartın içi) */
        .steam-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
        }

        /* Mouse ile üzerine gelince çalışacak kart efekti */
        .game-card:hover {
            transform: translateY(-5px); /* Yukarı doğru hafifçe zıplar (büyüme yerine bu daha şıktır) */
            background: rgba(255, 255, 255, 0.08); /* Arka planı hafifçe parlatır */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); /* Gölgeyi belirginleştirir */
        }

        /* Oyun Görseli (Küçültülmüş boyut) */
        .game-image {
            max-width: 230px; /* Yarıya düşürüldü (Eskiden 460px idi) */
            width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        /* Oyun İsmi */
        .game-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); /* Yazıya hafif bir karanlık gölge vererek okunaklılığı artırır */
        }
    </style>
</head>

<body>
    <!-- 1. Stüdyo Logosu (White versiyon) -->
    <img class="main-logo" src="EgoTrampolineTransWhite.png" alt="EgoTrampoline">

    <!-- 2. Oyun Kartı ve Steam Linki -->
    <div class="game-card">
        <a class="steam-link" href="https://store.steampowered.com/app/4935510/Cellar_Keeper/" target="_blank" rel="noopener noreferrer">
            
            <img class="game-image" src="cellar_keeper_library_capsule.png" alt="Cellar Keeper">
            
            <span class="game-title">Cellar Keeper</span>
        </a>
    </div>

</body>
</html>
